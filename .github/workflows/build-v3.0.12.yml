name: Build v3.0.12 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/v3.0.12-*'
    paths:
      - 'patches/v3.0.12/**'
      - '.github/workflows/build-v3.0.12.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download v3.0.11 installer and extract sources
        shell: pwsh
        timeout-minutes: 8
        run: |
          $url = "https://github.com/hanyeonsoo/jwsteel-release/releases/download/v3.0.11/JWSteel_Setup_v3.0.11.exe"
          $exe = "$env:RUNNER_TEMP\v311.exe"
          Invoke-WebRequest $url -OutFile $exe -UseBasicParsing

          $proc = Start-Process $exe `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/NOICONS","/CLOSEAPPLICATIONS","/DIR=C:\v311","/LOG=C:\v311-install.log" `
            -PassThru -WindowStyle Hidden
          if (-not $proc.WaitForExit(180000)) { $proc.Kill() }
          if (Test-Path "C:\v311-install.log") { Get-Content "C:\v311-install.log" -Tail 20 }

          if (-not (Test-Path "C:\v311\_internal\ui\main.py")) {
            choco install -y innoextract --no-progress
            $ie = "C:\ProgramData\chocolatey\bin\innoextract.exe"
            if (Test-Path $ie) {
              & $ie -d C:\v311 $exe
              if (Test-Path "C:\v311\app\_internal\ui\main.py") {
                Move-Item "C:\v311\app\*" "C:\v311\" -Force
              }
            }
          }
          if (-not (Test-Path "C:\v311\_internal\ui\main.py")) { throw "v3.0.11 source extraction FAILED" }

      - name: Build source tree with v3.0.12 patches + restored modules
        shell: pwsh
        run: |
          $work = "C:\work"
          New-Item -ItemType Directory -Path $work | Out-Null
          Copy-Item "C:\v311\_internal\*" $work -Recurse -Force

          # Patched UI files (v3.0.12 changes)
          Copy-Item "patches\v3.0.12\ui\common.py"                   "$work\ui\common.py" -Force
          Copy-Item "patches\v3.0.12\ui\main.py"                     "$work\ui\main.py" -Force
          Copy-Item "patches\v3.0.12\ui\widgets\_filter_bar.py"      "$work\ui\widgets\_filter_bar.py" -Force
          Copy-Item "patches\v3.0.12\ui\widgets\inventory.py"        "$work\ui\widgets\inventory.py" -Force
          Copy-Item "patches\v3.0.12\ui\widgets\inventory_picker.py" "$work\ui\widgets\inventory_picker.py" -Force
          Copy-Item "patches\v3.0.12\ui\widgets\login.py"            "$work\ui\widgets\login.py" -Force
          Copy-Item "patches\v3.0.12\ui\widgets\companies.py"        "$work\ui\widgets\companies.py" -Force
          Copy-Item "patches\v3.0.12\updater.py"                     "$work\updater.py" -Force
          Copy-Item "patches\v3.0.12\VERSION.txt"                    "$work\VERSION.txt" -Force

          # Restored modules (v3.0.11 had these MyPyC-compiled; v3.0.0 sources used)
          $restored = @("auth_module","backup_module","bank_module","collections_module",
                        "excel_export","first_run_setup","invoice_pdf",
                        "purchases_module","sales_module")
          foreach ($m in $restored) {
            $src = "patches\v3.0.12\$m.py"
            if (-not (Test-Path $src)) { throw "Missing fallback module: $m.py" }
            Copy-Item $src "$work\$m.py" -Force
          }

          Copy-Item "patches\v3.0.12\build\build_v3012.py" "$work\build_v3012.py" -Force

          Get-ChildItem $work -Filter "__pycache__" -Recurse -Directory | Remove-Item -Recurse -Force -EA SilentlyContinue
          Get-ChildItem $work -Filter "*.pyc" -Recurse | Remove-Item -Force -EA SilentlyContinue

          $required = @("auth_module.py","db_adapter.py","permissions.py","updater.py",
                        "inventory_module.py","sales_module.py","collections_module.py")
          foreach ($r in $required) {
            if (-not (Test-Path "$work\$r")) { throw "MISSING required module: $r" }
          }
          if (-not (Select-String "_make_field_label" "$work\ui\widgets\login.py")) { throw "login.py patch missing" }
          if (Select-String "LIMIT 1000" "$work\ui\widgets\companies.py") { throw "companies.py still has LIMIT 1000" }
          Write-Host "=== Root .py files in C:\work ==="
          Get-ChildItem $work -Filter "*.py" -File | Select-Object Name | Format-Table -AutoSize

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine pandas numpy openpyxl xlrd psycopg2-binary supabase requests pydantic pillow reportlab fastapi uvicorn

      - name: Build with PyInstaller (via build_v3012.py)
        shell: pwsh
        working-directory: C:\work
        run: |
          python build_v3012.py
          if (-not (Test-Path "C:\work\dist\JWSteel\JWSteel.exe")) { throw "PyInstaller failed" }
          $authBundled = (Get-ChildItem "C:\work\dist\JWSteel\_internal" -Filter "auth_module*" -Recurse).Count
          if ($authBundled -eq 0) { throw "auth_module NOT in bundle" }
          $webEngine = (Get-ChildItem "C:\work\dist\JWSteel\_internal" -Filter "QtWebEngine*" -Recurse).Count
          if ($webEngine -eq 0) { throw "QtWebEngine NOT in bundle - dashboard would fail" }
          Write-Host "auth_module: $authBundled, QtWebEngine files: $webEngine"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install -y innosetup --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -EA SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          echo "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile installer with Inno Setup
        shell: pwsh
        working-directory: C:\work
        run: |
          Copy-Item "${{ github.workspace }}\patches\v3.0.12\build\installer.iss" "C:\work\installer.iss" -Force
          & "$env:ISCC" "C:\work\installer.iss"
          if (-not (Test-Path "C:\work\output\JWSteel_Setup_v3.0.12.exe")) { throw "Inno Setup failed" }
          $info = Get-Item "C:\work\output\JWSteel_Setup_v3.0.12.exe"
          Write-Host "Installer built: $($info.Name) ($([math]::Round($info.Length / 1MB, 1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JWSteel_Setup_v3.0.12
          path: C:\work\output\JWSteel_Setup_v3.0.12.exe
          retention-days: 14
          if-no-files-found: error
